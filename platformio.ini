; =============================================================
;  AI Robot — PlatformIO configuration
;  Two build environments:
;    esp32s3 : real firmware and Wokwi simulation (Arduino framework)
;    native  : run the logic tests straight on your PC, no hardware
; =============================================================

[platformio]
default_envs = esp32s3

; --------------------------------------------------------------
;  Firmware for ESP32-S3 (used by both Wokwi and the real board)
; --------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; --------------------------------------------------------------
;  Logic tests on the PC — only the Navigator library is compiled
;  (the other libraries need Arduino.h, so they are ignored)
; --------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_ignore =
    MotorController
    DistanceSensor
    RobotDisplay
